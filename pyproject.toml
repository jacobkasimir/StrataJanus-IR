[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stratajanus"
version = "0.1.0"
description = "A layered search engine built from scratch in Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-benchmark", "hypothesis", "ruff", "mypy", "pre-commit", "pytest-cov"]
dense = ["sentence-transformers", "faiss-cpu"]
ltr = ["lightgbm", "scikit-learn"]
rag = ["openai", "python-dotenv"]
eval = ["ir-measures", "scipy", "pandas"]
bench = ["rank-bm25"]

[project.scripts]
# Placeholder entry point; stratajanus.cli.main:main is not implemented yet.
stratajanus = "stratajanus.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stratajanus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slow tests", "benchmark: benchmark tests"]

[tool.coverage.run]
source = ["stratajanus"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0
