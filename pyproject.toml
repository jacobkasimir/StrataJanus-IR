[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratajanus"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytrec_eval-terrier==0.5.11",
]

[tool.setuptools.packages.find]
where = ["src"]
